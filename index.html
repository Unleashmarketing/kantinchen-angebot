<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laras Kantinchen | Angebots-Planer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');

        :root {
            --primary-color: #5d4037; 
            --accent-color: #e67e22;  
            --bg-color: #f8f9fa;
            --border-color: #d7ccc8;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .wizard-container {
            background: white;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-radius: 12px;
            width: 100%;
            max-width: 850px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-placeholder {
            font-weight: bold;
            font-size: 24px;
            color: var(--primary-color);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        h2 { 
            color: var(--primary-color); 
            border-bottom: 2px solid var(--border-color); 
            padding-bottom: 15px; 
            margin-bottom: 25px; 
            font-size: 20px;
            text-transform: uppercase;
        }

        .grid-row { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 25px; 
            margin-bottom: 20px; 
        }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { 
            display: block; 
            font-size: 11px; 
            font-weight: 700; 
            margin-bottom: 6px; 
            color: #795548; 
            text-transform: uppercase; 
        }

        .form-group input, .form-group textarea {
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-family: inherit; 
            font-size: 14px;
        }

        /* --- Korrigierte Auswahl-Kacheln --- */
        .type-label {
            font-size: 13px;
            font-weight: 700;
            color: #795548;
            margin-top: 30px;
            margin-bottom: 15px;
            text-transform: uppercase;
            display: block;
        }

        .type-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
        }

        .type-card {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 35px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }

        .type-card h4 { 
            margin: 0; 
            font-size: 15px; 
            color: var(--primary-color); 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .type-card:hover {
            border-color: var(--primary-color);
            background-color: #fdfaf9;
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {
            .grid-row, .type-grid { grid-template-columns: 1fr; }
        }

        /* --- Gespeicherte Entwürfe --- */
        .drafts-section { margin-top: 40px; border-top: 2px solid var(--border-color); padding-top: 25px; }
        .drafts-section h3 { color: var(--primary-color); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .draft-list { display: flex; flex-direction: column; gap: 10px; }
        .draft-item {
            display: flex; align-items: center; justify-content: space-between;
            background: #fdfaf9; border: 1px solid var(--border-color);
            border-radius: 8px; padding: 12px 16px; gap: 10px;
        }
        .draft-info { flex: 1; min-width: 0; }
        .draft-info .draft-title { font-weight: 700; font-size: 13px; color: var(--primary-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .draft-info .draft-meta { font-size: 11px; color: #999; margin-top: 2px; }
        .draft-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .btn-draft-open {
            background: var(--primary-color); color: white; border: none;
            border-radius: 5px; padding: 7px 14px; font-size: 12px; font-weight: 700;
            cursor: pointer; white-space: nowrap;
        }
        .btn-draft-open:hover { opacity: 0.85; }
        .btn-draft-del {
            background: none; color: #c0392b; border: 1px solid #c0392b;
            border-radius: 5px; padding: 7px 10px; font-size: 12px; font-weight: 700;
            cursor: pointer;
        }
        .btn-draft-del:hover { background: #fdecea; }
        .no-drafts { font-size: 13px; color: #bbb; font-style: italic; }
    </style>
</head>
<body>

<div class="wizard-container">
    <header>
        <div class="logo-placeholder">LARAS KANTINCHEN</div>
        <h2>Angebots-Generator</h2>
    </header>
    
    <div class="grid-row">
        <div class="form-group">
            <label>Empfänger / Anschrift</label>
            <textarea id="inp-recipient" rows="5" placeholder="Name / Firma&#10;Straße Hausnummer&#10;PLZ Ort"></textarea>
        </div>
        
        <div>
            <div class="form-group">
                <label>Event / Anlass</label>
                <input type="text" id="inp-event" placeholder="z.B. Betriebsausflug">
            </div>
            <div class="form-group">
                <label>Ort / Location</label>
                <input type="text" id="inp-location" placeholder="z.B. Weingut XY">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Uhrzeit</label>
                    <input type="text" id="inp-time" placeholder="z.B. 18:00 - 22:00">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Event-Datum</label>
                    <input type="date" id="inp-date">
                </div>
            </div>
        </div>
    </div>

    <div class="grid-row">
        <div class="form-group">
            <label>Angebotsnummer</label>
            <input type="text" id="inp-offer-id" style="background:#f5f5f5; color: #777;">
        </div>
        <div class="form-group">
            <label>Reserviert bis zum</label>
            <input type="date" id="inp-valid-until">
        </div>
    </div>

    <span class="type-label">Bitte Angebotstyp wählen:</span>
    
    <div class="type-grid">
        <div class="type-card" onclick="submitTo('getraenke.html')">
            <h4>Getränke</h4>
        </div>

        <div class="type-card" onclick="submitTo('mindestabnahme.html')">
            <h4>Mindestmenge</h4>
        </div>

        <div class="type-card" onclick="submitTo('stueckzahl.html')">
            <h4>Stückzahl</h4>
        </div>

        <div class="type-card" onclick="submitTo('pro-person.html')">
            <h4>Pro Person</h4>
        </div>
    </div>
    
    <!-- Gespeicherte Entwürfe -->
    <div class="drafts-section" id="drafts-section" style="display:none;">
        <h3>📂 Gespeicherte Entwürfe</h3>
        <div class="draft-list" id="draft-list"></div>
    </div>
</div>

<script>
    function init() {
        document.getElementById('inp-date').valueAsDate = new Date();
        const validUntil = new Date();
        validUntil.setDate(validUntil.getDate() + 11);
        document.getElementById('inp-valid-until').valueAsDate = validUntil;

        let lastNum = localStorage.getItem('laras_last_id') || 50;
        let nextNum = parseInt(lastNum) + 1;
        const currentYear = new Date().getFullYear();
        document.getElementById('inp-offer-id').value = "A-" + nextNum.toString().padStart(3, '0') + "-" + currentYear;

        renderDrafts();
    }

    function getDrafts() {
        try { return JSON.parse(localStorage.getItem('laras_drafts') || '[]'); } catch(e) { return []; }
    }

    function saveDrafts(drafts) {
        localStorage.setItem('laras_drafts', JSON.stringify(drafts));
    }

    function renderDrafts() {
        const drafts = getDrafts();
        const section = document.getElementById('drafts-section');
        const list = document.getElementById('draft-list');
        if (drafts.length === 0) { section.style.display = 'none'; return; }
        section.style.display = '';
        const typeLabels = { 'getraenke.html': 'Getränke', 'mindestabnahme.html': 'Mindestmenge', 'stueckzahl.html': 'Stückzahl', 'pro-person.html': 'Pro Person' };
        list.innerHTML = drafts.map((d, i) => `
            <div class="draft-item">
                <div class="draft-info">
                    <div class="draft-title">${d.offerId || '–'} · ${d.event || '(kein Event)'}</div>
                    <div class="draft-meta">${typeLabels[d.page] || d.page} · gespeichert ${d.savedAt || ''}</div>
                </div>
                <div class="draft-actions">
                    <button class="btn-draft-open" onclick="openDraft(${i})">Öffnen</button>
                    <button class="btn-draft-del" onclick="deleteDraft(${i})">✕</button>
                </div>
            </div>`).join('');
    }

    function openDraft(index) {
        const drafts = getDrafts();
        const d = drafts[index];
        if (!d) return;
        const params = new URLSearchParams(d);
        window.location.href = d.page + '?' + params.toString() + '&draftIndex=' + index;
    }

    function deleteDraft(index) {
        const drafts = getDrafts();
        drafts.splice(index, 1);
        saveDrafts(drafts);
        renderDrafts();
    }

    function submitTo(targetPage) {
        const offerIdField = document.getElementById('inp-offer-id').value;
        
        const match = offerIdField.match(/-(\d+)-/);
        if (match && match[1]) {
            localStorage.setItem('laras_last_id', parseInt(match[1]));
        }

        const fields = {
            recipient: btoa(unescape(encodeURIComponent(document.getElementById('inp-recipient').value))),
            event: document.getElementById('inp-event').value,
            location: document.getElementById('inp-location').value,
            time: document.getElementById('inp-time').value,
            date: document.getElementById('inp-date').value,
            offerId: offerIdField,
            validUntil: document.getElementById('inp-valid-until').value
        };

        if(!document.getElementById('inp-recipient').value || !fields.event) {
            alert("Bitte Empfänger und Event-Namen angeben.");
            return;
        }

        const params = new URLSearchParams(fields);
        window.location.href = targetPage + "?" + params.toString();
    }

    init();
</script>

</body>
</html>
