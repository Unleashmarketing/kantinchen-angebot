<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Laras Kantinchen | Stückzahl-Angebot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');

        :root {
            --primary-color: #5d4037;
            --accent-orange: #e67e22;
        }

        body { font-family: 'Open Sans', sans-serif; background: #95a5a6; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        @page { margin: 0; size: A4; }

        .editor-panel { width: 420px; background: white; padding: 20px; box-shadow: 2px 0 15px rgba(0,0,0,0.2); overflow-y: auto; z-index: 10; }
        h2 { color: var(--primary-color); font-size: 16px; border-bottom: 2px solid var(--primary-color); padding-bottom: 5px; margin-top: 20px; text-transform: uppercase; }
        
        .section-box { background: #fdfaf9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; font-weight: bold; color: #555; margin-bottom: 4px; text-transform: uppercase; }
        .form-group input, .form-group textarea, .form-group select { 
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; font-size: 13px;
        }

        .btn { padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; color: white; transition: opacity 0.2s; }
        .btn-truck { background: var(--primary-color); }
        .btn-food { background: var(--accent-orange); margin-top: 10px; }
        .btn-print { background: #27ae60; margin-top: 30px; font-size: 16px; }

        /* Toggle Switch */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e0d8d4;
        }
        .toggle-row span {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            text-transform: uppercase;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 22px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            border-radius: 22px;
            transition: background-color 0.2s;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 3px; bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .toggle-switch input:checked + .toggle-slider { background-color: var(--primary-color); }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(20px); }

        /* Disabled fields styling */
        .zahlung-fields { transition: opacity 0.2s; }
        .zahlung-fields.disabled { opacity: 0.35; pointer-events: none; }

        .preview-panel { flex-grow: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 40px; }
        .a4-page { 
            width: 210mm; height: 297mm; background: white; padding: 20mm; 
            box-shadow: 0 0 20px rgba(0,0,0,0.4); box-sizing: border-box; position: relative; 
            display: flex; flex-direction: column; page-break-after: always;
            flex-shrink: 0; overflow: hidden;
        }

        .header-logo { position: absolute; top: 15mm; right: 20mm; width: 40mm; }
        .sender-line { font-size: 7.5pt; color: #000; text-decoration: none; margin-bottom: 30mm; }
        .address-box { font-size: 11pt; margin-bottom: 15mm; line-height: 1.4; min-height: 10mm; }
        .event-info { font-size: 10pt; margin-bottom: 5mm; border-collapse: collapse; }
        .event-info td { padding: 3px 0; }
        .event-info td:first-child { font-weight: bold; width: 35mm; }
        
        .reserviert-banner { color: var(--accent-orange); font-weight: bold; font-style: italic; text-align: center; font-size: 14pt; margin: 10mm 0; }
        .intro-text { font-size: 11pt; line-height: 1.6; white-space: pre-wrap; }

        .offer-header-small { font-size: 9pt; color: #555; margin-bottom: 5mm; }
        
        .truck-table { width: 100%; border-collapse: collapse; margin-bottom: 10mm; font-size: 8.5pt; table-layout: fixed; }
        .truck-table th, .truck-table td { border: 1px solid #000; padding: 8px; vertical-align: top; overflow-wrap: break-word; }
        .truck-table th { 
            background: var(--accent-orange); color: white; font-weight: 700; font-size: 10pt; text-align: center; 
        }

        .product-title { font-weight: bold; color: var(--primary-color); font-size: 9.5pt; }
        .product-desc { font-size: 8.5pt; color: #333; margin-top: 2px; }
        .vegan { color: #2e7d32; font-weight: bold; font-size: 9pt; }
        .totals-row { font-weight: bold; background: #fdfaf9; }
        .delete-overlay { color: red; cursor: pointer; font-weight: bold; font-size: 14px; margin-left: 10px; }

        .document-footer {
            position: absolute; bottom: 10mm; left: 20mm; right: 20mm;
            display: grid; grid-template-columns: repeat(4, 1fr);
            font-size: 7pt; color: #333; border-top: 0.5px solid #ccc; padding-top: 5px;
        }
        .footer-col { line-height: 1.4; }

        @media print {
            .editor-panel, .delete-overlay, .no-print { display: none !important; }
            .preview-panel { padding: 0; background: white; overflow: visible; display: block; }
            .a4-page { box-shadow: none; margin: 0; width: 210mm; height: 297mm; overflow: visible !important; page-break-after: always; }
            body { background: white; display: block; height: auto; overflow: visible; }
        }
    </style>
</head>
<body>

<div class="editor-panel">
    <h2>1. Einleitungstext</h2>
    <div class="section-box">
        <textarea id="edit-intro" rows="6" oninput="updateIntro()">Sehr geehrte Damen und Herren,

zunächst vielen Dank für Ihre Anfrage.

Bevor wir zu unserem Angebot kommen, möchte ich kurz erläutern was Pastrami ist:
Pastrami – klingt irgendwie italienisch – kommt aber ganz woanders her.

Pastrami, das ist das ultimative Delikatessen-Sandwich aus New York. Vor über 100 Jahren con Jüdischen Auswanderern in die Neue Welt mitgebracht, entwickelte sich das Pastrami Sandwich zum absoluten Liebling der USA.

Bestes Rindfleisch, das in einem speziellen Verfahren über längere Zeit gepökelt und mehrere Stunden in einer Gewürzkruste geräuchert wird. Hauchdünn geschnitten, wird es üppig zwischen zwei rösche Roggenmischbrotscheiben mit verschiedenen Toppings gelegt.

So wurde es zum beliebten Standard-Mittagessen – nicht nur für die Arbeiterklasse. Schnell, lecker und absolut sättigend, genauso machen wir es für Sie und bringen dieses traditionelle Sandwich in einem klassichen Citroen HY Bus, Baujahr 1970 zu Ihnen.

Dazu verwenden wir qulitativ hochwertige Produkte, vorwiegend aus unserer Region.

Wir freuen uns auf Ihre Rückmeldung!</textarea>
    </div>

    <h2>2. Trucks & Speisen</h2>
    <div class="section-box">
        <div class="form-group">
            <label>Truck Name</label>
            <input type="text" id="truck-name" placeholder="z.B. TRUCK 1">
        </div>
        <button class="btn btn-truck" onclick="addTruck()">+ Truck hinzufügen</button>
        
        <hr style="margin:15px 0; border:0; border-top:1px solid #ddd;">
        
        <div class="form-group">
            <label>Ziel-Truck</label>
            <select id="food-target"></select>
        </div>
        <div class="form-group">
            <label>Produkt-Vorlagen</label>
            <select id="food-presets" onchange="loadPreset()">
                <option value="">-- Bitte wählen --</option>
                <optgroup label="Grill & Equipment">
                    <option value="service">Servicegebühr & Truck</option>
                    <option value="grillstation">Grillstation</option>
                    <option value="zelt">Zelt 3 x 3 Meter</option>
                    <option value="klappbar">Klapp-Bar</option>
                    <option value="fritteuse">Fritteuse</option>
                </optgroup>
                <optgroup label="Pastrami Sandwiches">
                    <option value="ps_harry">Pastrami Sandwich Harry</option>
                    <option value="ps_sally">Pastrami Sandwich Sally</option>
                    <option value="ps_maxi">Pastrami Sandwich Maxi</option>
                </optgroup>
                <optgroup label="Pastrami Bowls">
                    <option value="pb_harry">Pastrami Bowl Harry</option>
                    <option value="pb_sally">Pastrami Bowl Sally</option>
                    <option value="pb_maxi">Pastrami Bowl Maxi</option>
                </optgroup>
                <optgroup label="Klassiker">
                    <option value="spaetzle">Käsespätzle</option>
                    <option value="salat">Pflücksalat</option>
                    <option value="curry">Linsen-Curry</option>
                    <option value="maultaschen">Geschmelzte Maultaschen</option>
                </optgroup>
                <optgroup label="Grill-Speisen">
                    <option value="pommes">Portion Pommes Frites (frisch)</option>
                    <option value="hamburger">Hamburger / Cheeseburger</option>
                    <option value="burgermenu">Burger-Menü</option>
                    <option value="salsiccia">Paar gegrillte Salsiccia</option>
                    <option value="bratwurst">Bratwurst im Brötchen</option>
                </optgroup>
            </select>
        </div>
        <div class="form-group">
            <label>Titel / Preis / Menge</label>
            <input type="text" id="food-title" style="margin-bottom:5px">
            <div style="display:flex; gap:5px">
                <input type="number" id="food-qty" value="1">
                <input type="number" id="food-price" step="0.01" placeholder="Preis Brutto">
            </div>
        </div>
        <div class="form-group">
            <label>Beschreibung</label>
            <textarea id="food-desc" rows="3"></textarea>
        </div>
        <button class="btn btn-food" onclick="addFood()">+ Speise hinzufügen</button>
    </div>

    <h2>3. Zahlungsmodalitäten</h2>
    <div class="section-box">
        <!-- Toggle -->
        <div class="toggle-row">
            <span>Im Angebot anzeigen</span>
            <label class="toggle-switch">
                <input type="checkbox" id="zahlung-toggle" checked onchange="toggleZahlung()">
                <span class="toggle-slider"></span>
            </label>
        </div>

        <!-- Felder (werden bei Toggle deaktiviert) -->
        <div class="zahlung-fields" id="zahlung-fields">
            <div class="form-group">
                <label>Anzahlung (€)</label>
                <input type="number" id="zahlung-anzahlung" value="0" step="0.01" oninput="render()">
            </div>
            <div class="form-group">
                <label>Fällig spätestens am (Anzahlung)</label>
                <input type="date" id="zahlung-datum1" oninput="render()">
            </div>
            <div class="form-group">
                <label>Restbetrag fällig spätestens am</label>
                <input type="date" id="zahlung-datum2" oninput="render()">
            </div>
            <div class="form-group">
                <label>Verwendungszweck</label>
                <input type="text" id="zahlung-zweck" placeholder="z.B. Angebot A-015-2026" oninput="render()">
            </div>
        </div>
    </div>

    <button class="btn btn-print" onclick="window.print()">ANGEBOT DRUCKEN (PDF)</button>
    <button class="btn" style="background:#f39c12;margin-top:10px;font-size:14px;" onclick="saveDraft()">💾 ENTWURF SPEICHERN</button>
</div>

<div class="preview-panel">
    <div id="cover-pages"></div>
    <div id="offer-pages"></div>
</div>

<script>
    var presets = {
        ps_sally: { title: "Pastrami Sandwich Sally", price: 8.50, desc: "Gegrillte Pastrami zwischen 2 gerösteten Roggenmischbrotscheiben mit mildem Senf, Sandwichgurken, knackigem Salat, Röstzwiebeln, hausgemachter Cocktailsoße und geschmolzenem Cheddar" },
        ps_harry: { title: "Pastrami Sandwich Harry", price: 8.50, desc: "Gegrillte Pastrami zwischen 2 gerösteten Roggenmischbrotscheiben mit mildem Senf, Sandwichgurken und hausgemachtem Krautsalat" },
        ps_maxi: { title: "Pastrami Sandwich Maxi", price: 9.50, desc: "Gegrillte Pastrami zwischen 2 gerösteten Roggenmischbrotscheiben mit mildem Senf, Sandwichgurken, knackigem Salat, Röstzwiebeln, hausgemachter Cocktailsoße, geschmolzenem Cheddar und ein doppelseitig gebratenes Spiegelei" },
        pb_sally: { title: "Pastrami Bowl Sally", price: 8.50, desc: "Gegrillte Pastrami auf knackigem Salat mit mildem Senf, Sandwichgurken-Schnitzen, darüber hausgemachte Cocktailsoße, Röstzwiebeln, geschmolzener Cheddar und frische Kräuter dazu geröstete Brotecken" },
        pb_harry: { title: "Pastrami Bowl Harry", price: 8.50, desc: "Gegrillte Pastrami auf knackigem Salat mit mildem Senf, Sandwichgurken-Schnitzen und hausgemachtem Krautsalat" },
        pb_maxi: { title: "Pastrami Bowl Maxi", price: 9.50, desc: "Gegrillte Pastrami auf knackigem Salat mit mildem Senf, Sandwichgurken-Schnitzen, darüber hausgemachte Cocktailsoße, Röstzwiebeln, geschmolzener Cheddar und ein doppelseitig gebratenes Spiegelei und frische Kräuter dazu geröstete Brotecken" },
        spaetzle: { title: "Käsespätzle mit Original Bergkäse-Mischung", price: 8.50, desc: "mit Röstzwiebeln, frischen Kräutern an Salatbouquet" },
        salat: { title: "Bunter Pflücksalat - vegetarisch -", price: 7.50, desc: "mit frischer Wassermelone unter Hirtenkäse-Streusel an Kräutervinaigrette dazu geröstete Brotecken" },
        curry: { title: "Veganes Linsen-Curry (pikant)", price: 8.50, desc: "mit frischem Koriander, gerösteten Cashew-Kernen und Limette an Basmatireis" },
        service: { title: "Servicegebühr inkl. Auf- und Abbau", price: 500.00, desc: "Servicegebühr inkl. Auf- und Abbau und 3 Stunden Verköstigungszeit mit 1 Oldtimer Truck, 2 Personal, Vorbereitung, Bioverpackungen, Servietten, Fahrtkosten und Reinigung" },
        grillstation: { title: "Grillstation", price: 180.00, desc: "Tisch, Grill, Gasflasche, Reinigung" },
        zelt: { title: "Zelt 3 x 3 Meter", price: 50.00, desc: "" },
        klappbar: { title: "Klapp-Bar", price: 25.00, desc: "" },
        fritteuse: { title: "Fritteuse", price: 100.00, desc: "" },
        pommes: { title: "Portion Pommes Frites (frisch)", price: 4.50, desc: "Incl. Heinz-Ketchup / Heinz-Pommes Soße" },
        hamburger: { title: "Hamburger / Cheeseburger (180 gr. Rind)", price: 9.50, desc: "Senf, Salat, Tomate, rote Zwiebeln, Jalapenos (wahlweise), Ketchup" },
        burgermenu: { title: "Burger-Menü (Burger und Pommes)", price: 13.00, desc: "" },
        salsiccia: { title: "Paar gegrillte Salsiccia", price: 10.00, desc: "an hausgemachtem mediterranem Kartoffelsalat" },
        bratwurst: { title: "Bratwurst im Brötchen", price: 5.00, desc: "incl. Ketchup / Senf" },
        maultaschen: { title: "Geschmelzte Maultaschen (Fleisch) auf buntem Pflücksalat", price: 8.50, desc: "mit Röstzwiebeln und hausgemachter Kräutervinaigrette, dazu Brotecken" }
    };

    let trucks = [];

    const FOOTER_HTML = '<div class="document-footer">' +
        '<div class="footer-col"><strong>Laras Kantinchen</strong><br>Chr.-Kröwerath-Str. 132<br>67071 Ludwigshafen</div>' +
        '<div class="footer-col">Fon: 01 72 - 6 67 67 87<br>Fax: 06 21 - 65 05 57 96<br>info@laras-kantinchen.de</div>' +
        '<div class="footer-col">Sparkasse Rhein-Haardt<br>IBAN: DE31 5465 1240 0006 1170 63</div>' +
        '<div class="footer-col">Michaela Breyer<br>USt-Id Nr. DE30 627 68 78<br>Steuer-Nr.: 27/149/80446</div>' +
    '</div>';

    function toggleZahlung() {
        var enabled = document.getElementById('zahlung-toggle').checked;
        var fields = document.getElementById('zahlung-fields');
        fields.classList.toggle('disabled', !enabled);
        render();
    }

    function init() {
        var p = new URLSearchParams(window.location.search);
        if(p.get('recipient')) {
            window._recipient = decodeURIComponent(escape(atob(p.get('recipient')))).replace(/\n/g, '<br>');
            window._event = p.get('event');
            window._location = p.get('location');
            window._time = p.get('time');
            window._offerId = p.get('offerId');
            window._validUntil = formatDate(p.get('validUntil'));
            window._date = "am " + formatDate(p.get('date'));
            window._today = new Date().toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        // Gespeicherten Entwurf wiederherstellen
        var draftIndex = p.get('draftIndex');
        if (draftIndex !== null) {
            try {
                var drafts = JSON.parse(localStorage.getItem('laras_drafts') || '[]');
                var d = drafts[parseInt(draftIndex)];
                if (d && d.editorState) {
                    var s = d.editorState;
                    if (s.intro) document.getElementById('inp-intro').value = s.intro;
                    if (s.zahlungToggle !== undefined) {
                        document.getElementById('zahlung-toggle').checked = s.zahlungToggle;
                        toggleZahlung();
                    }
                    if (s.zahlungAnzahlung) document.getElementById('zahlung-anzahlung').value = s.zahlungAnzahlung;
                    if (s.zahlungDatum1) document.getElementById('zahlung-datum1').value = s.zahlungDatum1;
                    if (s.zahlungDatum2) document.getElementById('zahlung-datum2').value = s.zahlungDatum2;
                    if (s.zahlungZweck) document.getElementById('zahlung-zweck').value = s.zahlungZweck;
                    if (s.trucks) { trucks = s.trucks; updateTruckList(); render(); }
                }
            } catch(e) {}
        }

        renderCover();
    }

    function saveDraft() {
        var p = new URLSearchParams(window.location.search);
        var editorState = {
            intro: document.getElementById('inp-intro').value,
            zahlungToggle: document.getElementById('zahlung-toggle').checked,
            zahlungAnzahlung: document.getElementById('zahlung-anzahlung').value,
            zahlungDatum1: document.getElementById('zahlung-datum1').value,
            zahlungDatum2: document.getElementById('zahlung-datum2').value,
            zahlungZweck: document.getElementById('zahlung-zweck').value,
            trucks: trucks
        };
        var draft = {
            page: 'stueckzahl.html',
            recipient: p.get('recipient') || '',
            event: p.get('event') || window._event || '',
            location: p.get('location') || '',
            time: p.get('time') || '',
            date: p.get('date') || '',
            offerId: p.get('offerId') || window._offerId || '',
            validUntil: p.get('validUntil') || '',
            savedAt: new Date().toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }),
            editorState: editorState
        };
        var drafts = [];
        try { drafts = JSON.parse(localStorage.getItem('laras_drafts') || '[]'); } catch(e) {}
        var draftIndex = p.get('draftIndex');
        if (draftIndex !== null && drafts[parseInt(draftIndex)]) {
            drafts[parseInt(draftIndex)] = draft;
        } else {
            drafts.unshift(draft);
        }
        localStorage.setItem('laras_drafts', JSON.stringify(drafts));
        alert('✅ Entwurf gespeichert!');
    }

    function formatDate(iso) { return iso ? iso.split('-').reverse().join('.') : ''; }

    function fmtEuro(n) {
        return n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function updateIntro() { renderCover(); }

    function renderCover() {
        var container = document.getElementById('cover-pages');
        container.innerHTML = '';

        var currentPage, currentContent, maxY;

        function createCoverPage(isFirst) {
            var page = document.createElement('div');
            page.className = 'a4-page';
            var content = document.createElement('div');

            if (isFirst) {
                content.innerHTML =
                    '<img src="LK_Logo_ohne_black.png" class="header-logo">' +
                    '<div class="sender-line">Laras Kantinchen, Chr.-Kröwerath-Straße 132, 67071 Ludwigshafen</div>' +
                    '<div class="address-box">' + (window._recipient || '') + '</div>' +
                    '<div style="text-align:right;font-size:10.5pt;margin-bottom:5mm;">' + (window._today || '') + '</div>' +
                    '<table class="event-info">' +
                        '<tr><td>Catering:</td><td>' + (window._date || '') + '</td></tr>' +
                        '<tr><td>Event:</td><td>' + (window._event || '') + '</td></tr>' +
                        '<tr><td>Ort / Location:</td><td>' + (window._location || '') + '</td></tr>' +
                        '<tr><td>Uhrzeit:</td><td>' + (window._time || '') + '</td></tr>' +
                        '<tr><td>Angebot Nr.:</td><td>' + (window._offerId || '') + '</td></tr>' +
                    '</table>' +
                    '<div class="reserviert-banner">Reserviert bis zum <span>' + (window._validUntil || '') + '</span></div>';
            }

            page.appendChild(content);
            page.insertAdjacentHTML('beforeend', FOOTER_HTML);
            container.appendChild(page);

            var footer = page.querySelector('.document-footer');
            maxY = footer.getBoundingClientRect().top - page.getBoundingClientRect().top - 5;
            currentPage = page;
            currentContent = content;
        }

        function contentBottom() {
            return currentContent.getBoundingClientRect().bottom - currentPage.getBoundingClientRect().top;
        }

        createCoverPage(true);

        var introText = document.getElementById('edit-intro').value;
        if (introText.trim()) {
            var paragraphs = introText.split('\n');
            paragraphs.forEach(function(para) {
                var p = document.createElement('div');
                p.className = 'intro-text';
                p.style.whiteSpace = 'normal';
                p.style.marginBottom = '0';
                p.style.lineHeight = '1.6';
                p.style.fontSize = '11pt';
                if (para.trim() === '') {
                    p.innerHTML = '&nbsp;';
                    p.style.lineHeight = '0.8';
                } else {
                    p.textContent = para;
                }
                currentContent.appendChild(p);
                if (contentBottom() > maxY) {
                    currentContent.removeChild(p);
                    createCoverPage(false);
                    currentContent.appendChild(p);
                }
            });
        }
    }

    function loadPreset() {
        var key = document.getElementById('food-presets').value;
        if(presets[key]) {
            document.getElementById('food-title').value = presets[key].title;
            document.getElementById('food-desc').value = presets[key].desc;
            document.getElementById('food-price').value = presets[key].price;
        }
    }

    function addTruck() {
        var name = document.getElementById('truck-name').value || "Truck " + (trucks.length + 1);
        trucks.push({ id: Date.now(), name: name.toUpperCase(), items: [] });
        updateTruckList();
        render();
    }

    function updateTruckList() {
        var sel = document.getElementById('food-target');
        sel.innerHTML = trucks.map(function(t) { return '<option value="' + t.id + '">' + t.name + '</option>'; }).join('');
    }

    function addFood() {
        var tId = document.getElementById('food-target').value;
        var truck = trucks.find(function(t) { return t.id == tId; });
        if(!truck) return alert("Bitte erst einen Truck anlegen!");
        var br = parseFloat(document.getElementById('food-price').value) || 0;
        truck.items.push({ 
            id: Date.now(), 
            title: document.getElementById('food-title').value, 
            desc: document.getElementById('food-desc').value, 
            qty: parseInt(document.getElementById('food-qty').value) || 1, 
            br: br, 
            ne: br / 1.07 
        });
        render();
    }

    function removeFood(tId, fId) {
        var truck = trucks.find(function(t) { return t.id == tId; });
        truck.items = truck.items.filter(function(f) { return f.id !== fId; });
        render();
    }

    function removeTruck(id) {
        trucks = trucks.filter(function(t) { return t.id !== id; });
        updateTruckList();
        render();
    }

    function render() {
        var pagesContainer = document.getElementById('offer-pages');
        pagesContainer.innerHTML = '';
        if (trucks.length === 0) return;

        var currentPage, currentContent, currentTable, currentTbody;
        var currentTruckName = null;
        var maxY = 0;
        var isFirstPage = true;

        function createPage() {
            var page = document.createElement('div');
            page.className = 'a4-page';
            var content = document.createElement('div');
            if (isFirstPage) {
                content.innerHTML = '<div class="offer-header-small">' +
                    'Hier unser Angebot für den vorgenannten Event:<br>' +
                    '<strong>Angebot Nr. ' + (window._offerId || '') + '</strong></div>';
                isFirstPage = false;
            }
            page.appendChild(content);
            page.insertAdjacentHTML('beforeend', FOOTER_HTML);
            pagesContainer.appendChild(page);
            var footer = page.querySelector('.document-footer');
            maxY = footer.getBoundingClientRect().top - page.getBoundingClientRect().top - 5;
            currentPage = page;
            currentContent = content;
            currentTable = null;
            currentTbody = null;
            currentTruckName = null;
        }

        function contentBottom() {
            return currentContent.getBoundingClientRect().bottom - currentPage.getBoundingClientRect().top;
        }

        function addRow(trHTML, truckName, truckId, tableClass, theadHTML, theadContinuationHTML) {
            if (truckName !== currentTruckName) {
                startTable(truckName, truckId, false, tableClass, theadHTML);
            }
            var tmp = document.createElement('tbody');
            tmp.innerHTML = trHTML;
            var tr = tmp.querySelector('tr');
            currentTbody.appendChild(tr);
            if (contentBottom() > maxY) {
                currentTbody.removeChild(tr);
                createPage();
                startTable(truckName, truckId, true, tableClass, theadContinuationHTML);
                currentTbody.appendChild(tr);
            }
        }

        function startTable(name, id, isContinuation, tableClass, theadHTML) {
            var tbl = document.createElement('table');
            tbl.className = tableClass;
            var thead = document.createElement('thead');
            thead.innerHTML = theadHTML;
            tbl.appendChild(thead);
            var tbody = document.createElement('tbody');
            tbl.appendChild(tbody);
            currentContent.appendChild(tbl);
            currentTable = tbl;
            currentTbody = tbody;
            currentTruckName = name;
        }

        function addElement(html) {
            var tmp = document.createElement('div');
            tmp.innerHTML = html;
            var el = tmp.firstElementChild;
            currentContent.appendChild(el);
            if (contentBottom() > maxY) {
                currentContent.removeChild(el);
                createPage();
                currentContent.appendChild(el);
            }
        }

        function truckTheadHTML(name, id) {
            return '<tr><th colspan="6">' + name + ' <span class="no-print" style="font-size:8pt;cursor:pointer;" onclick="removeTruck(' + id + ')"> (Truck entfernen)</span></th></tr>' +
                '<tr style="background:#fff;color:#333;font-size:8pt;"><th>Bezeichnung</th><th>Portionen</th><th>Einzel € netto</th><th>Einzel € brutto</th><th>Gesamt € netto</th><th>Gesamt € brutto</th></tr>';
        }
        function truckContTheadHTML(name) {
            return '<tr><th colspan="6">' + name + ' (Fortsetzung)</th></tr>' +
                '<tr style="background:#fff;color:#333;font-size:8pt;"><th>Bezeichnung</th><th>Portionen</th><th>Einzel € netto</th><th>Einzel € brutto</th><th>Gesamt € netto</th><th>Gesamt € brutto</th></tr>';
        }

        createPage();

        trucks.forEach(function(t) {
            var sN = 0, sB = 0;
            t.items.forEach(function(f) {
                var tN = f.qty * f.ne;
                var tB = f.qty * f.br;
                sN += tN; sB += tB;
                addRow('<tr><td><div class="product-title">' + f.title + '</div><div class="product-desc">' + f.desc + '</div>' +
                    '<span class="delete-overlay no-print" onclick="removeFood(' + t.id + ',' + f.id + ')">[Löschen]</span></td>' +
                    '<td align="center">' + f.qty + '</td><td align="right">' + fmtEuro(f.ne) + '</td><td align="right">' + fmtEuro(f.br) + '</td>' +
                    '<td align="right">' + fmtEuro(tN) + '</td><td align="right">' + fmtEuro(tB) + '</td></tr>',
                    t.name, t.id, 'truck-table', truckTheadHTML(t.name, t.id), truckContTheadHTML(t.name));
            });

            addRow('<tr class="totals-row"><td colspan="4"><strong>Summe ' + t.name + '</strong></td>' +
                '<td align="right"><strong>' + fmtEuro(sN) + '</strong></td><td align="right"><strong>' + fmtEuro(sB) + '</strong></td></tr>',
                t.name, t.id, 'truck-table', truckTheadHTML(t.name, t.id), truckContTheadHTML(t.name));
        });

        if (trucks.length > 1) {
            var totalN = 0, totalB = 0;
            trucks.forEach(function(t) {
                t.items.forEach(function(f) { totalN += f.qty * f.ne; totalB += f.qty * f.br; });
            });
            currentTruckName = null;
            var gHead = '<tr style="background:#fff;color:#333;font-size:8pt;"><th>Bezeichnung</th><th>Portionen</th><th>Einzel € netto</th><th>Einzel € brutto</th><th>Gesamt € netto</th><th>Gesamt € brutto</th></tr>';
            addRow('<tr style="font-weight:bold;font-size:10pt;background:#fdfaf9;"><td colspan="4"><strong>GESAMTSUMME ALLER TRUCKS</strong></td>' +
                '<td align="right"><strong>' + fmtEuro(totalN) + ' €</strong></td><td align="right"><strong>' + fmtEuro(totalB) + ' €</strong></td></tr>',
                '__GESAMT__', 0, 'truck-table', gHead, gHead);
            addRow('<tr><td colspan="6" style="border:none;font-size:7.5pt;color:#666;padding-top:10px;">Preise inkl. der gesetzl. Umsatzsteuer</td></tr>',
                '__GESAMT__', 0, 'truck-table', gHead, gHead);
        }

        // Zahlungsblock nur wenn Toggle aktiv
        var zahlungAktiv = document.getElementById('zahlung-toggle').checked;
        if (zahlungAktiv) {
            var anzahlung = parseFloat(document.getElementById('zahlung-anzahlung').value) || 0;
            var datum1Raw = document.getElementById('zahlung-datum1').value;
            var datum2Raw = document.getElementById('zahlung-datum2').value;
            var zweck = document.getElementById('zahlung-zweck').value || '';
            function fmtD(iso) { return iso ? iso.split('-').reverse().join('.') : 'tt.mm.jjjj'; }
            var d1 = fmtD(datum1Raw);
            var d2 = fmtD(datum2Raw);
            var zahlungHTML = '<div style="margin-top:8px;padding:12px 14px;background:#e8f4fd;border:2px solid #2980b9;border-radius:5px;font-size:9.5pt;color:#1a5276;">' +
                '<strong>Zahlungsmodalitäten:</strong><br><br>' +
                '&#x2022;&nbsp;<strong>' + fmtEuro(anzahlung) + ' €</strong> des Gesamtbetrages werden mit Bestätigung der Veranstaltung sofort fällig (spätestens am ' + d1 + ').<br><br>' +
                '&#x2022;&nbsp;Der Restbetrag ist zwei Wochen nach Event fällig (spätestens am ' + d2 + ').<br><br>' +
                '<span style="font-size:8.5pt;">Michaela Breyer, Laras Kantinchen, IBAN: DE31 5465 1240 0006 1170 63, Sparkasse Rhein-Haardt,<br>Verwendungszweck: ' + zweck + '</span>' +
                '</div>';
            addElement(zahlungHTML);
        }
    }

    init();
</script>
</body>
</html>
