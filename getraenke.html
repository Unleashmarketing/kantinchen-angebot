<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8"> 
    <title>Laras Kantinchen | Getränke-Angebot</title> 
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');
 
        :root {
            --primary-color: #5d4037;
            --accent-orange: #e67e22;
        }

        body { font-family: 'Open Sans', sans-serif; background: #95a5a6; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        @page { 
            margin: 0; 
            size: A4;
        }

        /* --- EDITOR SIDEBAR --- */
        .editor-panel { width: 420px; background: white; padding: 20px; box-shadow: 2px 0 15px rgba(0,0,0,0.2); overflow-y: auto; z-index: 10; }
        h2 { color: var(--primary-color); font-size: 16px; border-bottom: 2px solid var(--primary-color); padding-bottom: 5px; margin-top: 20px; text-transform: uppercase; }
        
        .section-box { background: #fdfaf9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; font-weight: bold; color: #555; margin-bottom: 4px; text-transform: uppercase; }
        .form-group input, .form-group textarea, .form-group select { 
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; font-size: 13px;
        }

        .btn { padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; color: white; transition: opacity 0.2s; }
        .btn-stand { background: var(--primary-color); }
        .btn-drink { background: var(--accent-orange); margin-top: 10px; }
        .btn-print { background: #27ae60; margin-top: 30px; font-size: 16px; }

        /* --- A4 PREVIEW --- */
        .preview-panel { flex-grow: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 40px; }
        .a4-page { 
            width: 210mm; height: 297mm; background: white; padding: 20mm; 
            box-shadow: 0 0 20px rgba(0,0,0,0.4); box-sizing: border-box; position: relative; 
            display: flex; flex-direction: column; page-break-after: always;
            flex-shrink: 0; overflow: hidden;
        }

        .header-logo { position: absolute; top: 15mm; right: 20mm; width: 40mm; }
        .sender-line { font-size: 7.5pt; color: #000; text-decoration: none; margin-bottom: 2mm; }
        .address-box { font-size: 11pt; margin-bottom: 15mm; line-height: 1.4; min-height: 10mm; }
        .event-info { font-size: 10pt; margin-bottom: 5mm; border-collapse: collapse; }
        .event-info td { padding: 3px 0; }
        .event-info td:first-child { font-weight: bold; width: 35mm; }
        
        .reserviert-banner { color: var(--accent-orange); font-weight: bold; font-style: italic; text-align: center; font-size: 14pt; margin: 15mm 0; }
        .intro-text { font-size: 11pt; line-height: 1.6; white-space: pre-wrap; }

        .offer-header-small { font-size: 9pt; color: #555; margin-bottom: 5mm; }
        
        /* EINHEITLICHES TABELLENDESIGN */
        .drink-table { width: 100%; border-collapse: collapse; margin-bottom: 10mm; font-size: 8.5pt; table-layout: fixed; }
        .drink-table th, .drink-table td { border: 1px solid #000; padding: 8px; vertical-align: top; overflow-wrap: break-word; }
        
        .drink-table th { 
            background: var(--accent-orange); 
            color: white; 
            font-weight: 700; 
            font-size: 10pt; 
            text-align: center; 
        }
        
        .col-drink { width: 60%; } 
        .col-size { width: 15%; }
        .col-price { width: 25%; }

        .drink-title { font-weight: bold; color: var(--primary-color); font-size: 9.5pt; }
        .drink-desc { font-size: 8.5pt; color: #333; margin-top: 2px; }
        .totals-row { font-weight: bold; background: #fdfaf9; }
        .delete-overlay { color: red; cursor: pointer; font-weight: bold; font-size: 14px; margin-left: 10px; }

        /* Footer */
        .document-footer {
            position: absolute; bottom: 10mm; left: 20mm; right: 20mm;
            display: grid; grid-template-columns: repeat(4, 1fr);
            font-size: 7pt; color: #333; border-top: 0.5px solid #ccc; padding-top: 5px;
        }
        .footer-col { line-height: 1.4; }

        @media print {
            .editor-panel, .delete-overlay, .no-print { display: none !important; }
            .preview-panel { padding: 0; background: white; overflow: visible; display: block; }
            .a4-page { box-shadow: none; margin: 0; width: 210mm; height: 297mm; overflow: visible !important; page-break-after: always; }
            body { background: white; display: block; height: auto; overflow: visible; }
        }
    </style>
</head>
<body>

<div class="editor-panel">
    <h2>1. Einleitungstext</h2>
    <div class="section-box">
        <textarea id="edit-intro" rows="6" oninput="updateIntro()">Sehr geehrte Damen und Herren,

zunächst vielen Dank für Ihre Anfrage.

Bevor wir zu unserem Angebot kommen, möchte ich kurz erläutern was Pastrami ist:
Pastrami – klingt irgendwie italienisch – kommt aber ganz woanders her.

Pastrami, das ist das ultimative Delikatessen-Sandwich aus New York. Vor über 100 Jahren con Jüdischen Auswanderern in die Neue Welt mitgebracht, entwickelte sich das Pastrami Sandwich zum absoluten Liebling der USA.

Bestes Rindfleisch, das in einem speziellen Verfahren über längere Zeit gepökelt und mehrere Stunden in einer Gewürzkruste geräuchert wird. Hauchdünn geschnitten, wird es üppig zwischen zwei rösche Roggenmischbrotscheiben mit verschiedenen Toppings gelegt.

So wurde es zum beliebten Standard-Mittagessen – nicht nur für die Arbeiterklasse. Schnell, lecker und absolut sättigend, genauso machen wir es für Sie und bringen dieses traditionelle Sandwich in einem klassichen Citroen HY Bus, Baujahr 1970 zu Ihnen.

Dazu verwenden wir qulitativ hochwertige Produkte, vorwiegend aus unserer Region.

Wir freuen uns auf Ihre Rückmeldung!</textarea>
    </div>

    <h2>2. Getränke-Stände</h2>
    <div class="section-box">
        <div class="form-group">
            <label>Stand Name</label>
            <input type="text" id="stand-name" placeholder="z.B. Limo & Bier">
        </div>
        <div class="form-group">
            <label>Servicegebühr (€ Brutto)</label>
            <input type="number" id="stand-service" value="500.00" step="0.01">
        </div>
        <button class="btn btn-stand" onclick="addStand()">+ Stand hinzufügen</button>
        
        <hr style="margin:15px 0; border:0; border-top:1px solid #ddd;">
        
        <div class="form-group">
            <label>Ziel-Stand</label>
            <select id="drink-target"></select>
        </div>
        <div class="form-group">
            <label>Getränke-Vorlagen</label>
            <select id="drink-presets" onchange="loadPreset()">
                <option value="">-- Bitte wählen --</option>
                <optgroup label="Alkoholfrei">
                    <option value="limo">Laute Limo 0,33l</option>
                    <option value="wasser">Mineralwasser 0,5l</option>
                    <option value="pils_af">Plan B - alkoholfreies Pils 0,33l</option>
                </optgroup>
                <optgroup label="Bier">
                    <option value="pils">Pils 0,33l</option>
                    <option value="helles">Helles 0,33l</option>
                    <option value="radler">Zischer - Radler 0,33l</option>
                    <option value="pale_ale">Pale Ale 0,5l</option>
                </optgroup>
                <optgroup label="Wein & Sekt">
                    <option value="aperol">Aperol-Spritz 0,2l</option>
                    <option value="riesling">Pfälzer Riesling Schorle 0,5l</option>
                    <option value="weissherbst">Pfälzer Weißherbst Schorle 0,5l</option>
                    <option value="weisswein">Weißwein 0,2l</option>
                    <option value="rose">Rosé 0,2l</option>
                </optgroup>
                <optgroup label="Heißgetränke">
                    <option value="gluehwein">Winzer-Glühwein 0,2l</option>
                    <option value="punsch">Alkoholfreier Apfel-Punsch</option>
                </optgroup>
            </select>
        </div>
        <div class="form-group">
            <label>Getränk / Größe / Preis</label>
            <input type="text" id="drink-title" style="margin-bottom:5px" placeholder="z.B. Laute Limo">
            <div style="display:flex; gap:5px">
                <input type="text" id="drink-size" placeholder="0,33l" style="flex:1">
                <input type="number" id="drink-price" step="0.01" placeholder="3,50" style="flex:1">
            </div>
        </div>
        <div class="form-group">
            <label>Beschreibung</label>
            <textarea id="drink-desc" rows="3" placeholder="Optional"></textarea>
        </div>
        <div class="form-group">
            <label>Pfand (€)</label>
            <input type="number" id="drink-pfand" step="0.50" value="0" placeholder="z.B. 1,00 oder 3,00">
        </div>
        <button class="btn btn-drink" onclick="addDrink()">+ Getränk hinzufügen</button>
    </div>

    <h2>3. Mindestumsatz</h2>
    <div class="section-box">
        <div class="form-group">
            <label>Mindestumsatz Getränke (€)</label>
            <input type="number" id="inp-min-umsatz" value="0" step="0.01" oninput="render()">
        </div>
        <div class="form-group">
            <label>Pro Person (€)</label>
            <input type="number" id="inp-per-person" value="0" step="0.01" oninput="render()">
        </div>
        <div class="form-group">
            <label>Mindestanzahl Personen</label>
            <input type="number" id="inp-min-persons" value="0" oninput="render()">
        </div>
        <div class="form-group">
            <label>Mindestumsatz-Text</label>
            <textarea id="edit-mindestumsatz" rows="12" oninput="render()">MINDESTUMSATZ-Garantie für diese Veranstaltung:

Für die Gläser stellen wir eine Spül- und Polierstation.
Wir werden eine separate Pfandrückgabestation aufstellen.

BITTE HABEN SIE VERSTÄNDNIS DAFÜR, DASS WIR BEI EINER VERANSTALTUNG MIT SELBSTZAHLERN NICHT DAS ALLEINIGE RISIKO TRAGEN KÖNNEN UND MÖCHTEN (WETTER, ...)

SOLLTEN SIE UNSER ANGEBOT ANNEHMEN, NEHMEN SIE AUCH DAS RISIKO AUF SICH, UND MÜSSTEN EVTL. DIE DIFFERENZ TRAGEN, WENN DER MINDESTUMSATZ NICHT ERREICHT WURDE, WAS ABER IN DER REGEL KEIN THEMA IST.</textarea>
        </div>
    </div>

    <h2>4. Zahlungsmodalitäten</h2>
    <div class="section-box">
        <div class="form-group">
            <label>Fällig nach Event (Tage)</label>
            <input type="number" id="zahlung-tage" value="10" min="1" oninput="render()">
        </div>
    </div>

    <button class="btn btn-print" onclick="window.print()">ANGEBOT DRUCKEN (PDF)</button>
    <button class="btn" style="background:#f39c12;margin-top:10px;font-size:14px;" onclick="saveDraft()">💾 ENTWURF SPEICHERN</button>
</div>

<div class="preview-panel">
    <!-- SEITE 1+: Anschreiben (dynamisch, für langen Intro-Text) -->
    <div id="cover-pages"></div>

    <!-- SEITE 2+: dynamisch erzeugte Angebots-Seiten -->
    <div id="offer-pages"></div>
</div>

<script>
    const presets = {
        limo: { title: "Laute Limo", size: "0,33l", price: 3.50, pfand: 1.00, desc: "Fruchtig in der Zubereitung, weniger süß, mit weniger Kohlensäure. Sorten: Zitrone, Grapefrucht und Cola-Orange" },
        wasser: { title: "Mineralwasser classic / still", size: "0,5l", price: 3.50, pfand: 1.00, desc: "" },
        pils_af: { title: "Plan B - alkoholfreies Pils", size: "0,33l", price: 3.50, pfand: 1.00, desc: "" },
        pils: { title: "Pils", size: "0,33l", price: 3.50, pfand: 1.00, desc: "Privatbrauerei Sander, Worms" },
        helles: { title: "Helles", size: "0,33l", price: 3.50, pfand: 1.00, desc: "Privatbrauerei Sander, Worms" },
        radler: { title: "Zischer - Radler", size: "0,33l", price: 3.50, pfand: 1.00, desc: "Privatbrauerei Sander, Worms" },
        pale_ale: { title: "Pale Ale", size: "0,5l", price: 4.00, pfand: 1.00, desc: "Privatbrauerei Sander, Worms" },
        aperol: { title: "Aperol-Spritz", size: "0,2l", price: 7.00, pfand: 3.00, desc: "" },
        riesling: { title: "Pfälzer Riesling -trocken-", size: "0,5l", price: 5.00, pfand: 3.00, desc: "Weinschorle" },
        weissherbst: { title: "Pfälzer Weißherbst -trocken-", size: "0,5l", price: 5.00, pfand: 3.00, desc: "Weinschorle" },
        weisswein: { title: "Riesling-Cuvée \"Tagtraum\"", size: "0,2l", price: 6.00, pfand: 3.00, desc: "Weingut Ellermann & Spiegel" },
        rose: { title: "Rose-Cuvée \"Windrose\"", size: "0,2l", price: 6.00, pfand: 3.00, desc: "Weingut Ellermann & Spiegel" },
        gluehwein: { title: "Winzer-Glühwein", size: "0,2l", price: 4.00, pfand: 2.00, desc: "Weingut Metzger" },
        punsch: { title: "Alkoholfreier Apfel-Punsch mit Zimtstange", size: "", price: 3.00, pfand: 2.00, desc: "" }
    };

    let stands = [];

    const FOOTER_HTML = '<div class="document-footer">' +
        '<div class="footer-col"><strong>Laras Kantinchen</strong><br>Chr.-Kröwerath-Str. 132<br>67071 Ludwigshafen</div>' +
        '<div class="footer-col">Fon: 01 72 - 6 67 67 87<br>Fax: 06 21 - 65 05 57 96<br>info@laras-kantinchen.de</div>' +
        '<div class="footer-col">Sparkasse Rhein-Haardt<br>IBAN: DE31 5465 1240 0006 1170 63</div>' +
        '<div class="footer-col">Michaela Breyer<br>USt-Id Nr. DE30 627 68 78<br>Steuer-Nr.: 27/149/80446</div>' +
    '</div>';

    function init() {
        const p = new URLSearchParams(window.location.search);
        if(p.get('recipient')) {
            window._recipient = decodeURIComponent(escape(atob(p.get('recipient')))).replace(/\n/g, '<br>');
            window._event = p.get('event');
            window._location = p.get('location');
            window._time = p.get('time');
            window._offerId = p.get('offerId');
            window._validUntil = formatDate(p.get('validUntil'));
            window._date = "am " + formatDate(p.get('date'));
            window._today = new Date().toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        // Gespeicherten Entwurf wiederherstellen
        const draftIndex = p.get('draftIndex');
        if (draftIndex !== null) {
            try {
                const drafts = JSON.parse(localStorage.getItem('laras_drafts') || '[]');
                const d = drafts[parseInt(draftIndex)];
                if (d && d.editorState) {
                    const s = d.editorState;
                    if (s.intro) document.getElementById('edit-intro').value = s.intro;
                    if (s.minUmsatz) document.getElementById('inp-min-umsatz').value = s.minUmsatz;
                    if (s.perPerson) document.getElementById('inp-per-person').value = s.perPerson;
                    if (s.minPersons) document.getElementById('inp-min-persons').value = s.minPersons;
                    if (s.zahlungTage) document.getElementById('zahlung-tage').value = s.zahlungTage;
                    if (s.stands) { stands = s.stands; updateStandList(); render(); }
                }
            } catch(e) {}
        }

        renderCover();
    }

    function saveDraft() {
        const p = new URLSearchParams(window.location.search);
        const editorState = {
            intro: document.getElementById('edit-intro').value,
            minUmsatz: document.getElementById('inp-min-umsatz').value,
            perPerson: document.getElementById('inp-per-person').value,
            minPersons: document.getElementById('inp-min-persons').value,
            zahlungTage: document.getElementById('zahlung-tage').value,
            stands: stands
        };
        const draft = {
            page: 'getraenke.html',
            recipient: p.get('recipient') || '',
            event: p.get('event') || window._event || '',
            location: p.get('location') || '',
            time: p.get('time') || '',
            date: p.get('date') || '',
            offerId: p.get('offerId') || window._offerId || '',
            validUntil: p.get('validUntil') || '',
            savedAt: new Date().toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }),
            editorState: editorState
        };
        let drafts = [];
        try { drafts = JSON.parse(localStorage.getItem('laras_drafts') || '[]'); } catch(e) {}
        const draftIndex = p.get('draftIndex');
        if (draftIndex !== null && drafts[parseInt(draftIndex)]) {
            drafts[parseInt(draftIndex)] = draft;
        } else {
            drafts.unshift(draft);
        }
        localStorage.setItem('laras_drafts', JSON.stringify(drafts));
        alert('✅ Entwurf gespeichert!');
    }

    function formatDate(iso) { return iso ? iso.split('-').reverse().join('.') : ''; }

    function fmtEuro(n) {
        // Format number with German locale: dot as thousands separator, comma as decimal
        return n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function updateIntro() { renderCover(); }

    /* ==========================================================
       renderCover() — baut Seite 1 (Anschreiben) dynamisch auf.
       Der Intro-Text wird absatzweise eingefügt und gemessen.
       Bei Überlauf wird eine Folgeseite erstellt.
       ========================================================== */
    function renderCover() {
        const container = document.getElementById('cover-pages');
        container.innerHTML = '';

        let currentPage, currentContent, maxY;

        function createCoverPage(isFirst) {
            const page = document.createElement('div');
            page.className = 'a4-page';
            const content = document.createElement('div');

            if (isFirst) {
                content.innerHTML =
                    '<img src="LK_Logo_ohne_black.png" class="header-logo">' +
                    '<div class="sender-line">Laras Kantinchen, Chr.-Kröwerath-Straße 132, 67071 Ludwigshafen</div>' +
                    '<div class="address-box" id="out-recipient">' + (window._recipient || '') + '</div>' +
                    '<div style="text-align:right;font-size:10.5pt;margin-bottom:5mm;" id="out-today">' + (window._today || '') + '</div>' +
                    '<table class="event-info">' +
                        '<tr><td>Catering:</td><td id="out-date">' + (window._date || '') + '</td></tr>' +
                        '<tr><td>Event:</td><td id="out-event">' + (window._event || '') + '</td></tr>' +
                        '<tr><td>Ort / Location:</td><td id="out-location">' + (window._location || '') + '</td></tr>' +
                        '<tr><td>Uhrzeit:</td><td id="out-time">' + (window._time || '') + '</td></tr>' +
                        '<tr><td>Angebot Nr.:</td><td id="out-offer-id">' + (window._offerId || '') + '</td></tr>' +
                    '</table>' +
                    '<div class="reserviert-banner">Reserviert bis zum <span id="out-valid-until">' + (window._validUntil || '') + '</span></div>';
            }

            page.appendChild(content);
            page.insertAdjacentHTML('beforeend', FOOTER_HTML);
            container.appendChild(page);

            const footer = page.querySelector('.document-footer');
            maxY = footer.getBoundingClientRect().top - page.getBoundingClientRect().top - 5;

            currentPage = page;
            currentContent = content;
        }

        function contentBottom() {
            return currentContent.getBoundingClientRect().bottom - currentPage.getBoundingClientRect().top;
        }

        // Erste Cover-Seite
        createCoverPage(true);

        // Intro-Text absatzweise einfügen
        const introText = document.getElementById('edit-intro').value;
        if (introText.trim()) {
            const paragraphs = introText.split('\n');

            paragraphs.forEach(function(para) {
                const p = document.createElement('div');
                p.className = 'intro-text';
                p.style.whiteSpace = 'normal';
                p.style.marginBottom = '0';
                p.style.lineHeight = '1.6';
                p.style.fontSize = '11pt';

                if (para.trim() === '') {
                    // Leerzeile → kleiner Abstand
                    p.innerHTML = '&nbsp;';
                    p.style.lineHeight = '0.8';
                } else {
                    p.textContent = para;
                }

                currentContent.appendChild(p);

                if (contentBottom() > maxY) {
                    currentContent.removeChild(p);
                    createCoverPage(false);
                    currentContent.appendChild(p);
                }
            });
        }
    }
    
    function loadPreset() {
        const key = document.getElementById('drink-presets').value;
        if(presets[key]) {
            document.getElementById('drink-title').value = presets[key].title;
            document.getElementById('drink-size').value = presets[key].size;
            document.getElementById('drink-desc').value = presets[key].desc;
            document.getElementById('drink-price').value = presets[key].price;
            document.getElementById('drink-pfand').value = presets[key].pfand;
        }
    }

    function addStand() {
        const name = document.getElementById('stand-name').value || "Stand " + (stands.length + 1);
        const service = parseFloat(document.getElementById('stand-service').value) || 0;
        stands.push({ id: Date.now(), name: name, service: service, items: [] });
        updateStandList();
        render();
    }

    function updateStandList() {
        const sel = document.getElementById('drink-target');
        sel.innerHTML = stands.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    }

    function addDrink() {
        const sId = document.getElementById('drink-target').value;
        const stand = stands.find(s => s.id == sId);
        if(!stand) return alert("Bitte erst einen Stand anlegen!");
        stand.items.push({ 
            id: Date.now(), 
            title: document.getElementById('drink-title').value,
            size: document.getElementById('drink-size').value,
            desc: document.getElementById('drink-desc').value, 
            price: parseFloat(document.getElementById('drink-price').value) || 0,
            pfand: parseFloat(document.getElementById('drink-pfand').value) || 0
        });
        render();
    }

    function removeDrink(sId, dId) {
        const stand = stands.find(s => s.id == sId);
        stand.items = stand.items.filter(d => d.id !== dId);
        render();
    }

    function removeStand(id) {
        stands = stands.filter(s => s.id !== id);
        updateStandList();
        render();
    }

    /* ====================================================================
       render() — baut Angebotsseiten dynamisch auf.
       Jede Tabellenzeile wird einzeln eingefügt und gemessen.
       Wenn sie die Fußzeile überlappen würde, wird eine neue Seite
       erstellt und die Tabelle dort mit Fortsetzungs-Header weitergeführt.
       ==================================================================== */
    function render() {
        const pagesContainer = document.getElementById('offer-pages');
        pagesContainer.innerHTML = '';

        if (stands.length === 0) return;

        /* --- Seiten-Verwaltung --- */
        let currentPage, currentContent, currentTable, currentTbody;
        let currentStandName = null;
        let maxY = 0;
        let isFirstPage = true;

        function createPage() {
            const page = document.createElement('div');
            page.className = 'a4-page';

            const content = document.createElement('div');

            if (isFirstPage) {
                content.innerHTML = '<div class="offer-header-small">' +
                    'Hier unser Angebot für den vorgenannten Event:<br>' +
                    '<strong>Angebot Nr. ' + (window._offerId || '') + '</strong></div>';
                isFirstPage = false;
            }

            page.appendChild(content);
            page.insertAdjacentHTML('beforeend', FOOTER_HTML);
            pagesContainer.appendChild(page);

            // Fußzeile messen → Grenze berechnen
            const footer = page.querySelector('.document-footer');
            maxY = footer.getBoundingClientRect().top - page.getBoundingClientRect().top - 5;

            currentPage = page;
            currentContent = content;
            currentTable = null;
            currentTbody = null;
            currentStandName = null;
        }

        function startTable(name, id, isContinuation) {
            const tbl = document.createElement('table');
            tbl.className = 'drink-table';

            const thead = document.createElement('thead');
            if (isContinuation) {
                thead.innerHTML = '<tr><th colspan="3">' + name + ' (Fortsetzung)</th></tr>' +
                    '<tr style="background:#fff;color:#333;font-size:8pt;">' +
                    '<th class="col-drink">Bezeichnung</th><th class="col-size">Größe</th><th class="col-price">Preis brutto €</th></tr>';
            } else {
                thead.innerHTML = '<tr><th colspan="3">' + name +
                    ' <span class="no-print" style="font-size:8pt;cursor:pointer;" onclick="removeStand(' + id + ')"> (Stand entfernen)</span></th></tr>' +
                    '<tr style="background:#fff;color:#333;font-size:8pt;">' +
                    '<th class="col-drink">Bezeichnung</th><th class="col-size">Größe</th><th class="col-price">Preis brutto €</th></tr>';
            }
            tbl.appendChild(thead);

            const tbody = document.createElement('tbody');
            tbl.appendChild(tbody);
            currentContent.appendChild(tbl);

            currentTable = tbl;
            currentTbody = tbody;
            currentStandName = name;
        }

        function contentBottom() {
            return currentContent.getBoundingClientRect().bottom - currentPage.getBoundingClientRect().top;
        }

        function addRow(trHTML, standName, standId) {
            // Neue Tabelle nötig?
            if (standName !== currentStandName) {
                startTable(standName, standId, false);
            }

            // Zeile einfügen
            const tmp = document.createElement('tbody');
            tmp.innerHTML = trHTML;
            const tr = tmp.querySelector('tr');
            currentTbody.appendChild(tr);

            // Passt es?
            if (contentBottom() > maxY) {
                // Nein → Zeile entfernen, neue Seite, Tabelle fortsetzen
                currentTbody.removeChild(tr);
                createPage();
                startTable(standName, standId, true);
                currentTbody.appendChild(tr);
            }
        }

        /* --- Los geht's --- */
        createPage();

        stands.forEach(function(stand) {
            // Servicegebühr
            addRow('<tr>' +
                '<td colspan="2"><div class="drink-title">Miet- und Servicegebühr</div>' +
                '<div class="drink-desc">Inkl. Anfahrtskosten für 1 Oldtimer Truck, Auf- und Abbau, 3 Stunden Verköstigungszeit mit 2 x Personal, Vorbereitung, Bioverpackungen und Biobesteck, Servietten, Palmblattteller, Tafeln, Kräutertöpfe, Fahrtkosten und Reinigung</div></td>' +
                '<td align="right">' + fmtEuro(stand.service) + ' €</td></tr>',
                stand.name, stand.id);

            // Getränke
            stand.items.forEach(function(drink) {
                const pfand = drink.pfand > 0 ? '<br><span style="font-size:7.5pt;color:#666;">zzgl. ' + fmtEuro(drink.pfand) + ' € Pfand</span>' : '';
                addRow('<tr>' +
                    '<td class="col-drink"><div class="drink-title">' + drink.title + (drink.size ? ' ' + drink.size : '') + '</div>' +
                    (drink.desc ? '<div class="drink-desc">' + drink.desc + '</div>' : '') +
                    '<span class="delete-overlay no-print" onclick="removeDrink(' + stand.id + ',' + drink.id + ')">[Löschen]</span></td>' +
                    '<td align="center" class="col-size">' + drink.size + '</td>' +
                    '<td align="right" class="col-price">' + fmtEuro(drink.price) + ' €' + pfand + '</td></tr>',
                    stand.name, stand.id);
            });
        });

        /* --- Mindestumsatz-Info --- */
        const minUmsatz = parseFloat(document.getElementById('inp-min-umsatz').value) || 0;
        const perPerson = parseFloat(document.getElementById('inp-per-person').value) || 0;
        const minPersons = parseInt(document.getElementById('inp-min-persons').value) || 0;
        const customText = document.getElementById('edit-mindestumsatz').value;

        if (minUmsatz > 0 || perPerson > 0) {
            let text = '<strong>' + customText.split('\n')[0] + '</strong><br><br>';
            if (minPersons > 0) text += 'Bei mind. ' + minPersons + ' Gästen – ';
            if (perPerson > 0) text += fmtEuro(perPerson) + ' € pro Person für Getränke';
            if (minUmsatz > 0) text += ' (Gesamt: ' + fmtEuro(minUmsatz) + ' €)';
            text += ' zzgl. der Leihgebühren.<br><br>';
            const lines = customText.split('\n');
            for (let i = 1; i < lines.length; i++) {
                text += lines[i].trim() ? lines[i] + '<br>' : '<br>';
            }

            const infoDiv = document.createElement('div');
            infoDiv.style.cssText = 'margin-top:15mm;padding:10px;background:#fff3cd;border:1px solid var(--accent-orange);border-radius:5px;font-size:9pt;white-space:pre-wrap;';
            infoDiv.innerHTML = text;
            currentContent.appendChild(infoDiv);

            if (contentBottom() > maxY) {
                currentContent.removeChild(infoDiv);
                createPage();
                currentContent.appendChild(infoDiv);
            }

            // Zahlungshinweis
            const tage = parseInt(document.getElementById('zahlung-tage').value) || 10;
            const zahlungDiv = document.createElement('div');
            zahlungDiv.style.cssText = 'margin-top:8px;padding:10px 14px;background:#e8f4fd;border:2px solid #2980b9;border-radius:5px;font-size:9.5pt;font-weight:bold;color:#1a5276;';
            zahlungDiv.textContent = 'Der evtl. Ausgleichsbetrag ist innerhalb ' + tage + ' Tagen nach Event ohne Abzug fällig.';
            currentContent.appendChild(zahlungDiv);
            if (contentBottom() > maxY) {
                currentContent.removeChild(zahlungDiv);
                createPage();
                currentContent.appendChild(zahlungDiv);
            }
        }
    }

    init();
</script>
</body>
</html>
